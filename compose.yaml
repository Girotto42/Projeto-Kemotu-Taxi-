services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD para iniciar o ambiente}
      MYSQL_DATABASE: esf_frota
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD para iniciar o ambiente}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/esf_frota?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:

  <script>
    // ==========================================
    // MODO MOCK / BANCO CHUMBADO PARA LIVE SERVER
    // ==========================================
    // Defina como 'true' para testar offline via Live Server.
    // Quando religar o Spring Boot, basta mudar para 'false'.
    const USAR_BANCO_MOCK = true;

    const bancoMockInicial = {
      funcionarios: [
        { idFuncionario: 1, nome: 'Roberto Mendes', email: 'roberto.mendes@kemotutaxi.com.br', senha: '12345678', cpf: '345.678.901-22', cargo: 'Gestor de Frota', telefone: '(18) 99823-1122', situacao: 'Ativo' },
        { idFuncionario: 2, nome: 'Carlos Eduardo Silva', email: 'carlos@kemotutaxi.com.br', senha: '12345678', cpf: '123.456.789-00', cargo: 'Motorista Titular', telefone: '(18) 99712-3456', situacao: 'Ativo' },
        { idFuncionario: 3, nome: 'Ana Paula Ferreira', email: 'ana.paula@kemotutaxi.com.br', senha: '12345678', cpf: '234.567.890-11', cargo: 'Motorista Noturno', telefone: '(18) 99654-9876', situacao: 'Ativo' }
      ],
      veiculos: [
        { idVeiculo: 1, placa: 'ABC1D23', marca: 'Chevrolet', modelo: 'Onix Sedan', anoFabricacao: 2023, quantidadePortas: 4, quilometragem: 45200, situacao: 'Em_uso' },
        { idVeiculo: 2, placa: 'KMT4E56', marca: 'Toyota', modelo: 'Corolla Hybrid', anoFabricacao: 2024, quantidadePortas: 4, quilometragem: 18500, situacao: 'Disponivel' },
        { idVeiculo: 3, placa: 'RIO9F88', marca: 'Hyundai', modelo: 'HB20S', anoFabricacao: 2022, quantidadePortas: 4, quilometragem: 78900, situacao: 'Em_manutencao' },
        { idVeiculo: 4, placa: 'FTE3A11', marca: 'Volkswagen', modelo: 'Virtus', anoFabricacao: 2023, quantidadePortas: 4, quilometragem: 32100, situacao: 'Em_uso' }
      ],
      alocacoes: [
        { idAlocacao: 1, funcionario: { idFuncionario: 2 }, veiculo: { idVeiculo: 1 }, dataInicio: '2024-01-15', situacao: 'Ativa' },
        { idAlocacao: 2, funcionario: { idFuncionario: 3 }, veiculo: { idVeiculo: 4 }, dataInicio: '2024-02-01', situacao: 'Ativa' }
      ],
      manutencoes: [
        { idManutencao: 1, veiculo: { idVeiculo: 3 }, tipoManutencao: 'Corretiva', descricao: 'Troca da caixa de câmbio e pastilhas de freio', dataPrevista: '2026-11-08', valor: 3450.00, situacao: 'Em_andamento' },
        { idManutencao: 2, veiculo: { idVeiculo: 1 }, tipoManutencao: 'Preventiva', descricao: 'Troca de óleo, filtro de ar e alinhamento', dataPrevista: '2026-10-10', valor: 650.00, situacao: 'Concluida' },
        { idManutencao: 3, veiculo: { idVeiculo: 2 }, tipoManutencao: 'Preventiva', descricao: 'Revisão geral de 20.000 KM', dataPrevista: '2026-11-20', valor: 890.00, situacao: 'Programada' }
      ],
      obrigacoes: [
        { idObrigacao: 1, veiculo: { idVeiculo: 1 }, tipoObrigacao: 'IPVA 2026', exercicio: 2026, valor: 1850.00, dataVencimento: '2026-03-15', dataPagamento: '2026-03-10', situacao: 'Pago' },
        { idObrigacao: 2, veiculo: { idVeiculo: 3 }, tipoObrigacao: 'Licenciamento Anual', exercicio: 2026, valor: 160.00, dataVencimento: '2026-11-12', dataPagamento: null, situacao: 'Pendente' },
        { idObrigacao: 3, veiculo: { idVeiculo: 4 }, tipoObrigacao: 'Multa Excesso de Velocidade', exercicio: 2026, valor: 195.23, dataVencimento: '2026-10-25', dataPagamento: null, situacao: 'Vencido' },
        { idObrigacao: 4, veiculo: { idVeiculo: 2 }, tipoObrigacao: 'Vistoria Semestral TÁXI', exercicio: 2026, valor: 280.00, dataVencimento: '2026-11-30', dataPagamento: null, situacao: 'Pendente' }
      ]
    };

    let mockDb = JSON.parse(localStorage.getItem('esf_mock_db')) || bancoMockInicial;
    function salvarMockDb() {
      localStorage.setItem('esf_mock_db', JSON.stringify(mockDb));
    }

    // URL Base do Back-end Spring Boot
    const API_URL = window.location.origin;
    let apiAuthorization = null;

    function escaparHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[caractere]);
    }

    function base64Utf8(valor) {
      const bytes = new TextEncoder().encode(valor);
      let binario = '';
      bytes.forEach(byte => binario += String.fromCharCode(byte));
      return btoa(binario);
    }

    // --- INTERCEPTOR DE API (SUPORTE AO MOCK OU SPRING BOOT) --- //
    async function apiFetch(path, options = {}) {
      if (USAR_BANCO_MOCK) {
        await new Promise(r => setTimeout(r, 60)); // Simula latência de rede
        const method = options.method || 'GET';
        const body = options.body ? JSON.parse(options.body) : null;

        // 1. Autenticação: Login
        if (path === '/api/auth/login' && method === 'POST') {
          const usuario = mockDb.funcionarios.find(f => f.email.toLowerCase() === body.email.toLowerCase() && f.senha === body.senha);
          if (usuario) return { ok: true, json: async () => usuario };
          throw new Error('E-mail ou senha incorretos.');
        }

        // 2. Autenticação: Registro de Conta
        if (path === '/api/auth/register' && method === 'POST') {
          if (mockDb.funcionarios.some(f => f.email.toLowerCase() === body.email.toLowerCase())) {
            throw new Error('E-mail já cadastrado no sistema.');
          }
          const novoId = mockDb.funcionarios.length ? Math.max(...mockDb.funcionarios.map(f => f.idFuncionario)) + 1 : 1;
          const novoFunc = { idFuncionario: novoId, ...body, situacao: 'Ativo' };
          mockDb.funcionarios.push(novoFunc);
          salvarMockDb();
          return { ok: true, status: 201, json: async () => novoFunc };
        }

        // 3. Gestão de Veículos

    function alternarAbaAutenticacao(aba) {

      const btnRegistro = document.getElementById('tab-register-btn');
      const formLogin = document.getElementById('form-login');
      const formRegistro = document.getElementById('form-register');

      if (aba === 'login') {

        btnRegistro.className = 'py-2.5 text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 text-zinc-400 hover:text-white';

        btnRegistro.className = 'py-2.5 text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 bg-brand-yellow text-black shadow';
        btnLogin.className = 'py-2.5 text-xs font-bold rounded-xl transition flex items-center justify-center gap-2 text-zinc-400 hover:text-white';
        formRegistro.classList.remove('hidden');
        formLogin.classList.add('hidden');

    function exibirAlertaAutenticacao(msg) {
      const alerta = document.getElementById('auth-alert');
      document.getElementById('auth-alert-msg').innerText = msg;
      alerta.classList.remove('hidden');
    }

    function ocultarAlertaAutenticacao() {
      document.getElementById('auth-alert').classList.add('hidden');
    }

    function alternarVisibilidadeSenha(idCampo, btn) {
      const campo = document.getElementById(idCampo);
      if (campo.type === 'password') {
        campo.type = 'text';
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        campo.type = 'password';
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
    }

    async function executarLogin(e) {
      e.preventDefault();
      ocultarAlertaAutenticacao();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const senha = document.getElementById('login-password').value;
      try {
        const resposta = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, senha })
        });
        usuarioAtual = await resposta.json();
        apiAuthorization = `Basic ${base64Utf8(`${email}:${senha}`)}`;
        await carregarDadosApi();
        exibirPainelPrincipal();
      } catch (erro) {
        apiAuthorization = null;
        exibirAlertaAutenticacao(erro.message || 'Não foi possível conectar ao servidor.');
      }
    }

    async function executarCadastro(e) {
      e.preventDefault();
      ocultarAlertaAutenticacao();
      const nome = document.getElementById('reg-nome').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const cpf = document.getElementById('reg-cpf').value.trim();
      const cargo = document.getElementById('reg-cargo').value;
      const senha = document.getElementById('reg-password').value;
      const confirmarSenha = document.getElementById('reg-confirm').value;
      if (senha !== confirmarSenha) return exibirAlertaAutenticacao('As senhas digitadas não coincidem.');
      try {
        await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ nome, email, cpf, cargo, senha })
        });
        alert('Cadastro realizado com sucesso! Faça login para continuar.');
        alternarAbaAutenticacao('login');
      } catch (erro) {
        exibirAlertaAutenticacao(erro.message || 'Não foi possível cadastrar. Verifique os dados informados.');
      }
    }

    async function carregarDadosApi() {
      const recursos = ['veiculos', 'funcionarios', 'alocacoes', 'manutencoes', 'obrigacoes'];
      for (const recurso of recursos) {
        const resposta = await apiFetch(`/api/${recurso}`);
        db[recurso] = formatarRecurso(await resposta.json(), recurso);
      }
    }

    function executarLogout() {
      usuarioAtual = null;
      apiAuthorization = null;
      exibirTelaLogin();
    }

    function abrirModalEsqueceuSenha() { document.getElementById('forgot-modal').classList.remove('hidden'); }
    function fecharModalEsqueceuSenha() { document.getElementById('forgot-modal').classList.add('hidden'); }
    function tratarEnvioEsqueceuSenha(e) {
      e.preventDefault();
      fecharModalEsqueceuSenha();

    }

        funcionarios: 'Gestão de Colaboradores & Vinculações (RF01/RF03)',
        manutencoes: 'Controle de Manutenção Preventiva e Corretiva (RF06)',
        obrigacoes: 'Serviços Legais, IPVA, Licenciamento & Multas (RF05)',
        relatorios: 'Relatórios Operacionais & Indicadores de Desempenho'
      };
      document.getElementById('header-page-title').innerText = titulos[idAba] || 'ESF - Easy System Fleet';

      const areaConteudo = document.getElementById('tab-content-area');
      if (idAba === 'dashboard') areaConteudo.innerHTML = renderizarAbaDashboard();
      else if (idAba === 'veiculos') areaConteudo.innerHTML = await renderizarAbaVeiculos();
      else if (idAba === 'funcionarios') areaConteudo.innerHTML = await renderizarAbaFuncionarios();
      else if (idAba === 'manutencoes') areaConteudo.innerHTML = await renderizarAbaManutencoes();
      else if (idAba === 'obrigacoes') areaConteudo.innerHTML = await renderizarAbaObrigacoes();
      else if (idAba === 'relatorios') areaConteudo.innerHTML = renderizarAbaRelatorios();

      if (idAba === 'dashboard') inicializarGraficoDashboard();
      if (idAba === 'relatorios') inicializarGraficoRelatorios();
    }

    async function salvarVeiculo(e, id) {
      e.preventDefault();
      const placa = document.getElementById('v-placa').value.toUpperCase();
      const marca = document.getElementById('v-marca').value.trim();
      const modelo = document.getElementById('v-modelo').value.trim();
      const anoFabricacao = parseInt(document.getElementById('v-ano').value, 10);
      const quantidadePortas = parseInt(document.getElementById('v-portas').value, 10);
      const quilometragem = parseFloat(document.getElementById('v-km').value);
      const situacao = ({ 'Disponível': 'Disponivel', 'Em uso': 'Em_uso', 'Em manutenção': 'Em_manutencao', 'Inativo': 'Inativo' })[document.getElementById('v-situacao').value];
      const payload = { placa, marca, modelo, anoFabricacao, quantidadePortas, quilometragem, situacao };
      try {
        const path = id ? `/api/veiculos/${id}` : '/api/veiculos';
        await apiFetch(path, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) });
        fecharModal();
        await alternarAba('veiculos');
      } catch (erro) {
        alert(erro.message || 'Não foi possível salvar o veículo.');
      }
    }

    function editarVeiculo(id) {
      const v = db.veiculos.find(x => x.id === id);
      if (v) abrirModalVeiculo(v);
    }

    async function excluirVeiculo(id) {
      if (!confirm('Deseja realmente remover este veículo da frota?')) return;
      try {
        await apiFetch(`/api/veiculos/${id}`, { method: 'DELETE' });
        await alternarAba('veiculos');
      } catch (erro) {
        alert(erro.message || 'Não foi possível excluir o veículo.');
      }
    }

          method: 'POST',

            funcionario: { idFuncionario },

        });

        await alternarAba('funcionarios');

        alert(erro.message || 'Não foi possível criar a vinculação.');

      const aloc = db.alocacoes.find(item => item.id === id);
      if (!aloc) return;
      try {
        await apiFetch(`/api/alocacoes/${id}`, {
          method: 'PUT',
          body: JSON.stringify({
            funcionario: { idFuncionario: aloc.id_funcionario },
            veiculo: { idVeiculo: aloc.id_veiculo },
            dataInicio: aloc.dataInicio,
            dataFim: new Date().toISOString().slice(0, 10),
            situacao: 'Encerrada'
          })
        });
        await alternarAba('funcionarios');
      } catch (erro) {
        alert(erro.message || 'Não foi possível encerrar a vinculação.');
      }
    }

    // --- RENDERIZAÇÃO: MANUTENÇÕES --- //
    async function renderizarAbaManutencoes() {
      try {
        const resposta = await apiFetch(`/api/manutencoes`);
        if (resposta.ok) {
          db.manutencoes = formatarRecurso(await resposta.json(), 'manutencoes');
        }
      } catch (e) {
        console.error("Erro ao buscar manutenções:", e);
        db.manutencoes = [];
      }

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-brand-card p-4 rounded-2xl border border-brand-border">
          <div>
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Histórico de Manutenções</h3>
            <p class="text-xs text-zinc-400">Serviços preventivos e corretivos da Kemotu Táxi (RF06)</p>
          </div>
          <button onclick="abrirModalManutencao()" class="px-4 py-2 bg-brand-yellow hover:bg-brand-hoverYellow text-black text-xs font-bold rounded-xl shadow flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Nova Manutenção
          </button>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-zinc-950 text-zinc-400 uppercase tracking-wider text-[10px] border-b border-brand-border">
                <tr>
                  <th class="p-4">Veículo</th>
                  <th class="p-4">Tipo</th>
                  <th class="p-4">Descrição</th>
                  <th class="p-4">Data Prevista</th>
                  <th class="p-4">Custo (R$)</th>
                  <th class="p-4">Situação</th>
                  <th class="p-4 text-right">Ações</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-800/60 font-medium">
                ${db.manutencoes.map(m => {
                  const veic = db.veiculos.find(v => v.id === m.id_veiculo || v.id === m.veiculoId);
                  const dataPrev = m.data_prevista || m.dataPrevista || 'N/A';
                  let badge = 'bg-zinc-800 text-amber-400';
                  if (m.situacao === 'Concluída') badge = 'bg-emerald-500/20 text-emerald-400';
                  if (m.situacao === 'Programada') badge = 'bg-blue-500/20 text-blue-400';
                  return `
                    <tr class="hover:bg-zinc-900/50">
                      <td class="p-4 font-mono font-bold text-brand-yellow">${escaparHtml(veic ? veic.placa : 'N/A')}</td>
                      <td class="p-4 font-bold text-white">${escaparHtml(m.tipo)}</td>
                      <td class="p-4 text-zinc-300 max-w-xs truncate">${escaparHtml(m.descricao)}</td>
                      <td class="p-4 text-zinc-400">${escaparHtml(dataPrev)}</td>
                      <td class="p-4 font-mono text-emerald-400">R$ ${Number(m.valor).toFixed(2)}</td>
                      <td class="p-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badge}">${escaparHtml(m.situacao)}</span></td>
                      <td class="p-4 text-right space-x-2">
                        <button onclick="editarManutencao(${m.id})" class="p-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="excluirManutencao(${m.id})" class="p-1.5 bg-red-950 hover:bg-red-900 text-red-400 rounded-lg" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function abrirModalManutencao(manut = null) {
      const eEdicao = !!manut;
      const modal = document.getElementById('modal-container');
      const hoje = new Date().toISOString().slice(0, 10);
      modal.innerHTML = `
        <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-md p-6 shadow-2xl">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-wrench text-brand-yellow"></i> ${eEdicao ? 'Editar Manutenção' : 'Registrar Manutenção'}
            </h4>
            <button onclick="fecharModal()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <form onsubmit="salvarManutencao(event, ${eEdicao ? manut.id : 'null'})" class="space-y-3">
            <div>
              <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Veículo</label>
              <select id="m-veiculo" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
                ${db.veiculos.map(v => `<option value="${v.id}" ${eEdicao && (manut.id_veiculo === v.id) ? 'selected' : ''}>${escaparHtml(v.placa)} - ${escaparHtml(v.marca)} ${escaparHtml(v.modelo)}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Tipo</label>
                <select id="m-tipo" class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
                  <option value="Preventiva" ${eEdicao && manut.tipo === 'Preventiva' ? 'selected' : ''}>Preventiva</option>
                  <option value="Corretiva" ${eEdicao && manut.tipo === 'Corretiva' ? 'selected' : ''}>Corretiva</option>
                </select>
              </div>
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Data Prevista</label>
                <input type="date" id="m-data" value="${eEdicao ? (manut.data_prevista || hoje) : hoje}" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Descrição do Serviço</label>
              <input type="text" id="m-descricao" value="${escaparHtml(eEdicao ? manut.descricao : '')}" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white" placeholder="Ex: Troca de óleo e filtros">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Custo (R$)</label>
                <input type="number" step="0.01" id="m-valor" value="${eEdicao ? manut.valor : ''}" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white" placeholder="0.00">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Situação</label>
                <select id="m-situacao" class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
                  <option value="Programada" ${eEdicao && manut.situacao === 'Programada' ? 'selected' : ''}>Programada</option>
                  <option value="Em andamento" ${eEdicao && manut.situacao === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                  <option value="Concluída" ${eEdicao && manut.situacao === 'Concluída' ? 'selected' : ''}>Concluída</option>
                  <option value="Cancelada" ${eEdicao && manut.situacao === 'Cancelada' ? 'selected' : ''}>Cancelada</option>
                </select>
              </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-zinc-800 text-xs text-zinc-300 font-semibold rounded-xl">Cancelar</button>
              <button type="submit" class="px-4 py-2 bg-brand-yellow text-black text-xs font-bold rounded-xl shadow">Salvar</button>
            </div>
          </form>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    async function salvarManutencao(e, id) {
      e.preventDefault();
      const idVeiculo = parseInt(document.getElementById('m-veiculo').value, 10);
      const tipoManutencao = document.getElementById('m-tipo').value;
      const dataPrevista = document.getElementById('m-data').value;
      const descricao = document.getElementById('m-descricao').value.trim();
      const valor = parseFloat(document.getElementById('m-valor').value);
      const situacao = ({ 'Programada': 'Programada', 'Em andamento': 'Em_andamento', 'Concluída': 'Concluida', 'Cancelada': 'Cancelada' })[document.getElementById('m-situacao').value];
      const payload = {
        veiculo: { idVeiculo },
        tipoManutencao,
        descricao,
        dataPrevista,
        valor,
        situacao
      };
      try {
        const path = id ? `/api/manutencoes/${id}` : '/api/manutencoes';
        await apiFetch(path, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) });
        fecharModal();
        await alternarAba('manutencoes');
      } catch (erro) {
        alert(erro.message || 'Não foi possível salvar a manutenção.');
      }
    }

    function editarManutencao(id) {
      const m = db.manutencoes.find(x => x.id === id);
      if (m) abrirModalManutencao(m);
    }

    async function excluirManutencao(id) {
      if (!confirm('Deseja realmente excluir este registro de manutenção?')) return;
      try {
        await apiFetch(`/api/manutencoes/${id}`, { method: 'DELETE' });
        await alternarAba('manutencoes');
      } catch (erro) {
        alert(erro.message || 'Não foi possível excluir a manutenção.');
      }
    }

    // --- RENDERIZAÇÃO: OBRIGAÇÕES LEGAIS --- //
    async function renderizarAbaObrigacoes() {
      try {
        const resposta = await apiFetch(`/api/obrigacoes`);
        if (resposta.ok) {
          db.obrigacoes = formatarRecurso(await resposta.json(), 'obrigacoes');
        }
      } catch (e) {
        console.error("Erro ao buscar obrigações:", e);
        db.obrigacoes = [];
      }

      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-brand-card p-4 rounded-2xl border border-brand-border">
          <div>
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Serviços Legais, IPVA & Multas</h3>
            <p class="text-xs text-zinc-400">Controle de impostos e obrigações da frota (RF05)</p>
          </div>
          <button onclick="abrirModalObrigacao()" class="px-4 py-2 bg-brand-yellow hover:bg-brand-hoverYellow text-black text-xs font-bold rounded-xl shadow flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Nova Obrigação / Multa
          </button>
        </div>

        <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-zinc-950 text-zinc-400 uppercase tracking-wider text-[10px] border-b border-brand-border">
                <tr>
                  <th class="p-4">Veículo</th>
                  <th class="p-4">Obrigação / Imposto</th>
                  <th class="p-4">Exercício</th>
                  <th class="p-4">Vencimento</th>
                  <th class="p-4">Valor</th>
                  <th class="p-4">Situação</th>
                  <th class="p-4 text-right">Ações</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-800/60 font-medium">
                ${db.obrigacoes.map(o => {
                  const veic = db.veiculos.find(v => v.id === o.id_veiculo || v.id === o.veiculoId);
                  let badge = 'bg-amber-500/20 text-amber-400';
                  if (o.situacao === 'Pago') badge = 'bg-emerald-500/20 text-emerald-400';
                  if (o.situacao === 'Vencido') badge = 'bg-red-500/20 text-red-400';

                  const venc = o.data_vencimento || o.dataVencimento || 'N/A';

                  return `
                    <tr class="hover:bg-zinc-900/50">
                      <td class="p-4 font-mono font-bold text-brand-yellow">${escaparHtml(veic ? veic.placa : 'N/A')}</td>
                      <td class="p-4 font-bold text-white">${escaparHtml(o.tipo)}</td>
                      <td class="p-4 text-zinc-400">${o.exercicio}</td>
                      <td class="p-4 text-zinc-400">${escaparHtml(venc)}</td>
                      <td class="p-4 font-mono text-white">R$ ${Number(o.valor).toFixed(2)}</td>
                      <td class="p-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${badge}">${escaparHtml(o.situacao)}</span></td>
                      <td class="p-4 text-right space-x-1">
                        ${o.situacao !== 'Pago' ? `
                          <button onclick="quitarObrigacao(${o.id})" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold rounded-lg shadow">Pagar</button>
                        ` : '<span class="text-zinc-500 text-[10px] mr-1">Quitado</span>'}
                        <button onclick="excluirObrigacao(${o.id})" class="p-1.5 bg-red-950 hover:bg-red-900 text-red-400 rounded-lg" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function abrirModalObrigacao() {
      const modal = document.getElementById('modal-container');
      const hoje = new Date().toISOString().slice(0, 10);
      modal.innerHTML = `
        <div class="bg-brand-card border border-brand-border rounded-2xl w-full max-w-md p-6 shadow-2xl">
          <div class="flex items-center justify-between mb-4">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-file-invoice-dollar text-brand-yellow"></i> Registrar Obrigação / Multa
            </h4>
            <button onclick="fecharModal()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <form onsubmit="salvarObrigacao(event)" class="space-y-3">
            <div>
              <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Veículo</label>
              <select id="o-veiculo" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
                ${db.veiculos.map(v => `<option value="${v.id}">${escaparHtml(v.placa)} - ${escaparHtml(v.marca)} ${escaparHtml(v.modelo)}</option>`).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Tipo / Descrição</label>
                <input type="text" id="o-tipo" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white" placeholder="Ex: IPVA, Licenciamento, Multa">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Exercício (Ano)</label>
                <input type="number" id="o-exercicio" value="2026" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Vencimento</label>
                <input type="date" id="o-vencimento" value="${hoje}" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
              </div>
              <div>
                <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Valor (R$)</label>
                <input type="number" step="0.01" id="o-valor" required class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white" placeholder="0.00">
              </div>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1">Situação</label>
              <select id="o-situacao" class="w-full px-3 py-2 glass-input rounded-xl text-xs text-white">
                <option value="Pendente">Pendente</option>
                <option value="Pago">Pago</option>
                <option value="Vencido">Vencido</option>
              </select>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="fecharModal()" class="px-4 py-2 bg-zinc-800 text-xs text-zinc-300 font-semibold rounded-xl">Cancelar</button>
              <button type="submit" class="px-4 py-2 bg-brand-yellow text-black text-xs font-bold rounded-xl shadow">Salvar</button>
            </div>
          </form>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    async function salvarObrigacao(e) {
      e.preventDefault();
      const idVeiculo = parseInt(document.getElementById('o-veiculo').value, 10);
      const tipoObrigacao = document.getElementById('o-tipo').value.trim();
      const exercicio = parseInt(document.getElementById('o-exercicio').value, 10);
      const dataVencimento = document.getElementById('o-vencimento').value;
      const valor = parseFloat(document.getElementById('o-valor').value);
      const situacao = document.getElementById('o-situacao').value;
      const payload = {
        veiculo: { idVeiculo },
        tipoObrigacao,
        exercicio,
        valor,
        dataVencimento,
        dataPagamento: situacao === 'Pago' ? new Date().toISOString().slice(0, 10) : null,
        situacao
      };
      try {
        await apiFetch('/api/obrigacoes', { method: 'POST', body: JSON.stringify(payload) });
        fecharModal();
        await alternarAba('obrigacoes');
      } catch (erro) {
        alert(erro.message || 'Não foi possível salvar a obrigação.');
      }
    }

    async function excluirObrigacao(id) {
      if (!confirm('Deseja realmente excluir esta obrigação?')) return;
      try {
        await apiFetch(`/api/obrigacoes/${id}`, { method: 'DELETE' });
        await alternarAba('obrigacoes');
      } catch (erro) {
        alert(erro.message || 'Não foi possível excluir a obrigação.');
      }
    }

    async function quitarObrigacao(id) {
      const obrigacao = db.obrigacoes.find(item => item.id === id);
      if (!obrigacao) return;
      try {
        await apiFetch(`/api/obrigacoes/${id}`, {
          method: 'PUT',
          body: JSON.stringify({
            veiculo: { idVeiculo: obrigacao.id_veiculo },
            tipoObrigacao: obrigacao.tipo,
            exercicio: obrigacao.exercicio,
            valor: obrigacao.valor,
            dataVencimento: obrigacao.data_vencimento,
            dataPagamento: new Date().toISOString().slice(0, 10),
            situacao: 'Pago'
          })
        });
        await alternarAba('obrigacoes');
      } catch (erro) {
        alert(erro.message || 'Não foi possível quitar a obrigação.');
      }
    }

    // --- RENDERIZAÇÃO: RELATÓRIOS E KPIS --- //
    function renderizarAbaRelatorios() {
      return `
        <div class="bg-brand-card p-4 rounded-2xl border border-brand-border">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Indicadores de Gestão (KPIs)</h3>
          <p class="text-xs text-zinc-400">Métricas financeiras e operacionais da frota Kemotu Táxi</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-brand-card border border-brand-border rounded-2xl p-5">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider mb-4">Distribuição Financeira de Custos</h4>
            <div class="h-64">
              <canvas id="relatoriosChart"></canvas>
            </div>
          </div>

          <div class="bg-brand-card border border-brand-border rounded-2xl p-5 space-y-4">
            <h4 class="text-xs font-bold text-white uppercase tracking-wider">Resumo Executivo</h4>
            <div class="p-3 bg-zinc-950 rounded-xl border border-zinc-800">
              <p class="text-[10px] font-bold text-zinc-400 uppercase">Custo Total de Manutenções</p>
              <p class="text-lg font-black text-brand-yellow">R$ ${db.manutencoes.reduce((acc, m) => acc + Number(m.valor || 0), 0).toFixed(2)}</p>
            </div>
            <div class="p-3 bg-zinc-950 rounded-xl border border-zinc-800">
              <p class="text-[10px] font-bold text-zinc-400 uppercase">Custo Total de Impostos & Licenciamentos</p>
              <p class="text-lg font-black text-emerald-400">R$ ${db.obrigacoes.reduce((acc, o) => acc + Number(o.valor || 0), 0).toFixed(2)}</p>
            </div>
          </div>
        </div>
      `;
    }

    function inicializarGraficoRelatorios() {
      const ctx = document.getElementById('relatoriosChart');
      if (!ctx || typeof Chart === 'undefined') return;
      if (graficoAtivo) graficoAtivo.destroy();

      const totalManut = db.manutencoes.reduce((acc, m) => acc + Number(m.valor || 0), 0);
      const totalObrig = db.obrigacoes.reduce((acc, o) => acc + Number(o.valor || 0), 0);

      graficoAtivo = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Manutenções', 'Impostos & Taxas'],
          datasets: [{
            data: [totalManut, totalObrig],
            backgroundColor: ['#F59E0B', '#10B981']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#A1A1AA' } } }
        }
      });
    }

    function fecharModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }
    function alternarSidebarMobile() {
      document.getElementById('main-sidebar').classList.toggle('hidden');
    }
  </script>
</body>
</html>
